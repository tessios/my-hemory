<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Hemory 개인용</title>
<meta name="description" content="내 드라이브에만 저장되는 개인 녹음·전사·검색 메모리">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hemory">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="app.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app">

  <!-- ── 인증 게이트 ─────────────────────────────── -->
  <section id="screen-gate" class="screen active">
    <div class="gate">
      <div class="gate-brand">HEMORY<span class="dot">·</span>PERSONAL</div>
      <div class="gate-mark"><img src="icons/icon-192.png" alt="" width="72" height="72"></div>
      <h1 class="gate-title">들은 것을<br>기억하는 나만의 메모리</h1>
      <p class="gate-desc">녹음하면 전사·요약되고, 문장을 눌러 다시 듣고,<br>기억나지 않는 말을 검색합니다.<br>모든 파일은 내 구글 드라이브에만 저장됩니다.</p>
      <button id="btn-signin" class="btn btn-primary btn-block">Google 계정으로 시작</button>
      <button id="btn-demo" class="btn btn-ghost btn-block">데모로 둘러보기</button>
      <button id="btn-gate-setup" class="link-btn">처음 설정 · Client ID 입력</button>
      <div class="gate-foot">v<span id="app-version">1.0</span> · 개인용 · 데이터는 공개되지 않습니다</div>
    </div>
  </section>

  <!-- ── 타임라인 ────────────────────────────────── -->
  <section id="screen-timeline" class="screen">
    <header class="head">
      <div class="head-row">
        <div>
          <div class="brand">HEMORY</div>
          <h1 class="head-title" id="tl-month">기록</h1>
        </div>
        <button class="icon-btn" id="btn-sync" title="동기화" aria-label="동기화">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 10a8 8 0 0 1 13.7-4.3L20 8M20 4v4h-4M20 14a8 8 0 0 1-13.7 4.3L4 16M4 20v-4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="head-sub" id="tl-sub">불러오는 중…</div>
    </header>
    <div class="chips" id="tl-chips"></div>
    <div id="tl-tip"></div>
    <div id="tl-list" class="list"></div>
  </section>

  <!-- ── 검색 ────────────────────────────────────── -->
  <section id="screen-search" class="screen">
    <header class="head head-search">
      <div class="searchbar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="q" type="text" inputmode="search" autocomplete="off" autocapitalize="off" placeholder="기억나지 않는 말을 검색" autocomplete="off" enterkeyhint="search">
        <button id="q-clear" class="q-clear" hidden aria-label="지우기">✕</button>
      </div>
      <div class="seg" id="search-mode">
        <button data-mode="search" class="on">검색</button>
        <button data-mode="ask">AI에게 묻기</button>
      </div>
    </header>
    <div class="chips" id="search-chips"></div>
    <div id="search-body" class="list"></div>
  </section>

  <!-- ── 설정 ────────────────────────────────────── -->
  <section id="screen-settings" class="screen">
    <header class="head">
      <div class="brand">HEMORY</div>
      <h1 class="head-title">설정</h1>
    </header>
    <div id="settings-body" class="settings"></div>
  </section>

  <!-- ── 하단 탭 ─────────────────────────────────── -->
  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="timeline" class="active">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>타임라인</span>
    </button>
    <button data-tab="search">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>검색</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <button class="fab" id="fab" hidden aria-label="녹음 시작">
    <svg viewBox="0 0 24 24" width="24" height="24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>

  <!-- ── Google 연결이 필요할 때만 나오는 막대 ─────────────── -->
  <button id="conn-bar" class="conn-bar" hidden>
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Google 연결이 잠시 끊겼습니다 · <b>탭하여 다시 연결</b></span>
  </button>
</div>

<div id="sheet-root"></div>
<div id="auto-bar" class="auto-bar" hidden></div>
<button id="flip-chip" class="flip-chip" hidden></button>
<div id="sleep-overlay" hidden><div class="so-body"><span class="so-dot"></span><span class="so-txt">녹음 중</span><span class="so-time" id="so-time">00:00</span></div><div class="so-hint">들면 자동으로 저장합니다</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
